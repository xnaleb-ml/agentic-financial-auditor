[project]
name = "agentic-financial-auditor"
version = "0.1.0"
description = "A dual-architecture agentic RAG pipeline for auditing SEC filings. Version 1 features a FastAPI backend powered by cloud LLMs. Version 2 is fully localized, serving open-weight models via vLLM. Built with LangGraph and evaluated on FinanceBench."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (automatically sorts imports)
    "B",  # flake8-bugbear (finds likely bugs)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"